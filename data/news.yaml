- date: "2026-10"
  body: >-
    My PhD thesis, [*On self-normalized importance sampling*](https://era.ed.ac.uk/items/1d79d56b-e8ae-45d2-88ca-2a9c2db5e9f4), is now publicly available.

- date: "2026-10"
  body: >-
    Glad to announce that we got two workshop papers accepted at NeurIPS. The first is *Robust monitoring of changes in sequential Bayesian experimental design*, with [Sara Pérez-Vieites](https://sarapv.github.io/), to appear in the [E-Values: From Statistics to ML](https://e-values-workshop.github.io/) workshop. The second is *Estimating rare event probabilities in masked diffusion language models* with Francesco Vinciguerra (first author), to appear in the [AI4GOOD](https://trustworthy-ai-for-good.github.io/) workshop.

- date: "2026-10"
  body: >-
    Pleased to announce that our paper on adaptive SNIS via MCMC was *rejected* (yes, you read it right) by NeurIPS 2026 with superficial feedback! Looking forward to submit to a journal.

- date: "2026-06"
  body: >-
    Happy to share that I passed my PhD viva in June! Many thanks to my examiners [Art Owen](https://statistics.stanford.edu/people/art-b-owen) and [Grégoire Clarté](https://sites.google.com/view/gregoireclarte/homepage).

- date: "2026"
  body: >-
    Happy to be invited for a talk at [StaTalk 2026](https://sites.google.com/view/statalk-2026/home) in Torino.

- date: "2026"
  body: >-
    Happy to give a contributed talk at the [London Meeting on Computational Statistics](https://fsml-ucl.github.io/CSMLworkshop2026/) at UCL.

- date: "2026"
  body: >-
    Happy to give a contributed talk at [MCQMC 2026](https://maths.ed.ac.uk/events/mcqmc-2026) in Edinburgh.

- date: "2026-03"
  body: >-
    Looking forward to attending the **ProbAI workshop at the Isaac Newton Institute in Cambridge** in March, as part of the Hub’s activities.

- date: "2026"
  body: >-
    Recently joined the University of Warwick as a **ProbAI research fellow**, where I will work with [Gareth Roberts](https://warwick.ac.uk/fac/sci/statistics/staff/academic-research/roberts/).

- date: "2026"
  body: >-
    Three new papers in 2026: *How to approximate inference with subtractive mixture models* (AISTATS 2026), *On the bias of variational resampling* (AISTATS 2026), and *Multimarginal Flow Matching with Adversarially Learnt Interpolants* (ICLR 2026). See more details on the [publications page](/pubs/).

- date: "2025"
  body: >-
    Our conference paper **Towards Adaptive Self-Normalized Importance Samplers** is accepted at the [Statistical Signal Processing Workshop (SSP), 2025](https://2025.ieeessp.org/). ✰

- date: "2025"
  body: >-
    Thanks to the **Institute for Mathematical and Statistical Innovation (IMSI)** for generously awarding me a travel grant of 1000 US dollars to attend [MCM 2025](https://ccbatiit.github.io/mcm2025/) in Chicago!

- date: "2024"
  body: >-
    Thanks to **G-Research** for [generously awarding me a grant so that I will be able to attend NeurIPS in Vancouver](https://www.gresearch.com/news/g-research-october-2024-grant-winners/?utm_campaign=Social%20Media%20Planner&utm_content=321823956&utm_medium=social&utm_source=linkedin&hss_channel=lcp-55375).

- date: "2024"
  body: >-
    Our **Generalized self-normalized importance sampling** [featured in Xi'an's blog](https://xianblog.wordpress.com/2024/06/05/6th-workshop-on-sequential-monte-carlo-methods-2/)! ✰ ✰

- date: "2024"
  body: >-
    Excited (and a bit stressed) to give a talk at [the 6th workshop on Sequential Monte Carlo (SMC 2024)](https://www.icms.org.uk/SMC2024). ✰

- date: "2024"
  body: >-
    *Adaptive importance sampling for heavy-tailed distributions via alpha-divergence minimization* to appear in AISTATS 2024. ✰

