<!DOCTYPE html>
<html>
{{ partial "header.html" . }}
<body>
  <div class="container wrapper post">
    {{ partial "head.html" . }}
    <div class="modern-container">
      <section class="content-section">
        <div class="section-title">News</div>
        {{ partial "news-list.html" (dict "items" .Site.Data.news "limit" 0) }}
      </section>
    </div>
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
