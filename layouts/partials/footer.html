<!-- MathJax renders the LaTeX preserved by Hugo's Goldmark passthrough extension. -->
<script>
    window.MathJax = {
        loader: {
            load: ['[tex]/boldsymbol', '[tex]/cancel', '[tex]/colorv2', '[tex]/enclose']
        },
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            processRefs: true,
            tags: 'ams',
            useLabelIds: true,
            packages: {'[+]': ['ams', 'boldsymbol', 'cancel', 'colorv2', 'enclose']}
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        chtml: {
            displayAlign: 'center',
            displayIndent: '0'
        }
    };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<script>
// Collapsible functionality for publications page
function initCollapsibles() {
    var coll = document.getElementsByClassName("collapsible");
    if (!coll || coll.length === 0) return;

    for (var i = 0; i < coll.length; i++) {
        // Avoid attaching multiple listeners if this is called more than once
        if (coll[i].dataset.collapsibleInit === "1") {
            continue;
        }
        coll[i].dataset.collapsibleInit = "1";

        coll[i].addEventListener("click", function() {
            this.classList.toggle("active");

            // In the rendered HTML the button is inside a <p>, and the
            // corresponding .content div is the next sibling of that <p>.
            var container = this.closest('p') || this.parentElement;
            var content = container ? container.nextElementSibling : null;

            // If the immediate sibling is not a .content div, look ahead
            while (content && !content.classList.contains("content")) {
                content = content.nextElementSibling;
            }

            if (content && content.classList.contains("content")) {
                if (content.style.maxHeight && content.style.maxHeight !== "0px") {
                    content.style.maxHeight = "0px";
                } else {
                    content.style.maxHeight = content.scrollHeight + "px";
                }
            }
        });
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCollapsibles);
} else {
    initCollapsibles();
}
</script>
